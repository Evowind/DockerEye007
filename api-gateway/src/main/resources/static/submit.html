<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit Run - DockerEye007</title>
    <link rel="stylesheet" href="css/elite-theme.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="portal-header">
        <div>
          <span class="eyebrow">The-Elite</span>
          <h1 class="portal-title">DockerEye007</h1>
          <div class="portal-subtitle">Run submission / leaderboard intake</div>
        </div>
      </header>

      <nav class="top-tabs" aria-label="Section navigation">
        <a class="tab" href="/index.html">Rankings Home</a>
        <a class="tab" href="/records.html">Apex Run</a>
        <a class="tab" href="/leaders.html">Nightfall</a>
        <a class="tab" href="/register.html">Members</a>
        <a class="tab active" href="/submit.html">Submit Run</a>
      </nav>

      <div class="form-area">
        <div class="card">
          <div class="card-header">Submit a Run</div>
          <div class="card-body">
            <form id="run-form">
              <div class="form-grid">
                <div class="field full">
                  <label for="playerName">Player</label>
                  <input id="playerName" name="playerName" required placeholder="alex" />
                </div>

                <div class="field full">
                  <label for="game">Game</label>
                  <select id="game" name="game">
                    <option value="Apex Run">Apex Run</option>
                    <option value="Nightfall">Nightfall</option>
                  </select>
                </div>

                <div class="field">
                  <label for="category">Category</label>
                  <input id="category" name="category" required placeholder="000" />
                </div>

                <div class="field">
                  <label for="timeMs">Time (ms)</label>
                  <input id="timeMs" name="timeMs" type="number" min="1" required placeholder="123456" />
                </div>
              </div>

              <button class="primary-btn" type="submit">Submit Run</button>
            </form>

            <div id="message" class="message" aria-live="polite"></div>

            <div class="footer">
              <a href="/index.html">Back to leaderboard</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('run-form');
      const message = document.getElementById('message');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.textContent = '';
        message.classList.remove('error');

        const payload = {
          playerName: document.getElementById('playerName').value,
          game: document.getElementById('game').value,
          category: document.getElementById('category').value,
          timeMs: Number(document.getElementById('timeMs').value)
        };

        try {
          const response = await fetch('http://localhost:8082/api/runs/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const text = await response.text();
          if (!response.ok) {
            throw new Error(text || 'Run submission failed');
          }

          message.textContent = 'Run submitted successfully.';
          form.reset();
        } catch (error) {
          message.textContent = error.message || 'Unable to submit this run.';
          message.classList.add('error');
        }
      });
    </script>
  </body>
</html>
